<!DOCTYPE html>
<html>
<head>
    <title>Testar Card SVG</title>
    <style>
        body { background: #0d1117; display: flex; justify-content: center; padding: 50px; }
        .card-container { background: #161b22; padding: 30px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card-container">
        <!-- Cole o SVG aqui -->
        <svg width="400" height="200" viewBox="0 0 400 200">
            <rect width="400" height="200" fill="#0d1117" rx="10" stroke="#30363d" stroke-width="2"/>
            <text x="30" y="45" fill="#ffffff" font-size="24" font-family="Arial" font-weight="bold">Prg-maker</text>
            <text x="30" y="80" fill="#2f81f7" font-size="18" font-family="Arial">&gt; Desenvolvedor Full Stack</text>
            <text x="30" y="115" fill="#8b949e" font-size="14" font-family="Arial">Passionate about building efficient, scalable and</text>
            <text x="30" y="135" fill="#8b949e" font-size="14" font-family="Arial">well-structured software solutions. Strong interest in</text>
            <text x="30" y="155" fill="#8b949e" font-size="14" font-family="Arial">Computer Science fundamentals and problem-solving.</text>
            <line x1="30" y1="175" x2="150" y2="175" stroke="#2f81f7" stroke-width="2"/>
        </svg>
    </div>
</body>
</html>
